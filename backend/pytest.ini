[pytest]
# The other scripts/test_*.py files are standalone smoke scripts that hit a live
# server at import time, so they must not be auto-collected. Default collection is
# scoped to the pytest-native suite; pass an explicit path to run anything else.
addopts = scripts/test_browser_slots.py scripts/test_searcher_client_photos.py scripts/test_searcher_client_review.py scripts/test_searcher_client_limit.py scripts/test_reviews_repository.py scripts/test_searcher_client_details.py scripts/test_details_repository.py scripts/test_migrate_drop_bike_detail.py
markers =
    llm: live eval that shells out to the `claude` CLI (slow, needs CLI login). Excluded by `-m "not llm"`; run nightly/pre-release.
