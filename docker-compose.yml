# Full stack on one machine: backend + frontend + OLX searcher, database = Cloud SQL on GCP (TODO-029/031).
#   docker compose up --build   →   http://localhost:8080
# Needs (all gitignored / outside the repo):
#   backend/.env                    ANTHROPIC_API_KEY, SEARCHER_API_KEY
#   searcher/.env                   SEARCHER_API_KEY (same value) + CLAUDE_CODE_OAUTH_TOKEN for the claude CLI
#   backend/gcp-prod-pgpass.conf    libpq pgpass line with the Cloud SQL password for user biker
#   gcloud ADC                      `gcloud auth application-default login` (used by the proxy)
# DATABASE_URL / PGPASSFILE are set here and override the .env values.
# The old local Postgres is kept behind a profile: `docker compose --profile local-db up db`.
services:
  cloudsql-proxy:
    image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.25.4
    command:
      - --address=0.0.0.0
      - --port=5432
      - --credentials-file=/config/adc.json
      - --quota-project=biker-engine-prod
      - biker-engine-prod:europe-central2:biker-pg
    volumes:
      - ${GCLOUD_ADC_FILE:-${APPDATA}/gcloud/application_default_credentials.json}:/config/adc.json:ro

  backend:
    build: ./backend
    env_file: backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://biker@cloudsql-proxy:5432/biker
      PGPASSFILE: /tmp/pgpass
      PLAYWRIGHT_HEADLESS: "true"
      SEARCHER_URL: http://searcher:8100   # SEARCHER_API_KEY comes from backend/.env
    volumes:
      - ./backend/gcp-prod-pgpass.conf:/run/secrets/pgpass:ro
    # libpq ignores a pgpass file readable by others (Windows bind mounts are 0777) and matches on
    # host:port — copy it with mode 600 and wildcard host/port, since the file lists 127.0.0.1:6543.
    command:
      - sh
      - -c
      - >-
        umask 077 && sed 's/^[^:]*:[^:]*:/*:*:/' /run/secrets/pgpass > /tmp/pgpass
        && exec uvicorn app.main:app --host 0.0.0.0 --port $${PORT}
    depends_on:
      - cloudsql-proxy
    restart: on-failure   # the proxy may still be starting when init_db() first connects
    ports:
      - "8000:8000"
    shm_size: "1gb"   # Chromium crashes with Docker's default 64 MB /dev/shm

  # On-demand OLX searcher (TODO-031): claude CLI + Playwright, writes bike_offer into the same database.
  searcher:
    build: ./searcher
    env_file: searcher/.env
    environment:
      DATABASE_URL: postgresql+psycopg://biker@cloudsql-proxy:5432/biker
      PGPASSFILE: /tmp/pgpass
      PLAYWRIGHT_HEADLESS: "true"
    volumes:
      - ./backend/gcp-prod-pgpass.conf:/run/secrets/pgpass:ro
    command:   # same pgpass dance as the backend
      - sh
      - -c
      - >-
        umask 077 && sed 's/^[^:]*:[^:]*:/*:*:/' /run/secrets/pgpass > /tmp/pgpass
        && exec uvicorn app.main:app --host 0.0.0.0 --port $${PORT}
    depends_on:
      - cloudsql-proxy
      - backend         # the backend's init_db() creates the shared tables …
    restart: on-failure # … and the searcher refuses to start until they exist
    ports:
      - "8100:8100"
    shm_size: "1gb"   # same Chromium /dev/shm issue as the backend

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:8080"

  db:
    profiles: ["local-db"]   # no longer used by the backend; kept so the old data stays reachable
    image: postgres:17
    environment:
      POSTGRES_USER: biker
      POSTGRES_PASSWORD: biker
      POSTGRES_DB: biker
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"   # 5433 so it does not clash with the dev container biker-pg on 5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U biker -d biker"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
