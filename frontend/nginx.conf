server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # Same routing Vite does in dev: API calls go to the backend service.
    location /v1/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # /v1/bike/details runs 8 sequential web searches — minutes, not seconds — and
        # /v1/bike/used/search waits up to the backend's SEARCHER_TIMEOUT (600 s), so
        # nginx gets a margin over it rather than cutting the answer first.
        proxy_read_timeout 660s;
        proxy_send_timeout 660s;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
